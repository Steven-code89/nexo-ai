<style>
  @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 400 800; font-display: swap; src: url('fonts/dm-sans-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 400 800; font-display: swap; src: url('fonts/dm-sans-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --g: #16a34a; --g-bg: #f0fdf4; --g-bd: #bbf7d0; --g-dk: #15803d; --ink: #0a0e1a; --mut: #64748b; --mut2: #94a3b8; --bd: #f1f5f9; --bd2: #e2e8f0; --bg: #f8fafc; --bar: 40px; }
  html, body { height: 100%; }
  body { font-family: 'DM Sans', -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  a { text-decoration: none; color: inherit; }
  ::-webkit-scrollbar { width: 5px; height: 5px; } ::-webkit-scrollbar-thumb { background: var(--bd2); border-radius: 10px; }
  :focus-visible { outline: 2px solid var(--g); outline-offset: 2px; }
  .ic { flex-shrink: 0; vertical-align: middle; }

  /* Demo bar (Nexo AI chrome, outside the product UI) */
  .demo-bar { height: var(--bar); background: var(--ink); color: #e2e8f0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; font-size: 12.5px; position: relative; z-index: 50; }
  .demo-bar b { color: #fff; }
  .demo-bar .tag { background: #f2542d; color: #fff; font-weight: 700; font-size: 10.5px; letter-spacing: .06em; padding: 3px 8px; border-radius: 20px; margin-right: 10px; }
  .demo-bar .acts { display: flex; align-items: center; gap: 8px; }
  .db-btn { background: transparent; border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .db-btn:hover { border-color: #fff; }
  .db-btn.pri { background: #f2542d; border-color: #f2542d; }
  .db-btn.pri:hover { background: #d43e1a; border-color: #d43e1a; }

  .app { display: flex; height: calc(100dvh - var(--bar)); }
  /* Sidebar */

  .sb-tg { background: none; border: none; color: var(--mut2); padding: 4px; display: grid; place-items: center; }
  .sb.col .nm, .sb.col .biz, .sb.col .lbl, .sb.col .sb-foot .plan { display: none; }

  .biz { padding: 12px 14px; border-bottom: 1px solid var(--bd); }

  .biz b { font-size: 13px; font-weight: 600; }
  .biz select { width: 100%; margin-top: 8px; border: 1px solid var(--bd2); border-radius: 8px; padding: 6px 8px; font-size: 12px; background: #fff; }
  .nav { flex: 1; overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--mut); border-left: 3px solid transparent; transition: all .15s; white-space: nowrap; }
  .nav a:hover { background: var(--bg); color: #374151; }
  .nav a.on { background: var(--g-bg); color: var(--g); font-weight: 700; border-left-color: var(--g); }
  .sb.col .nav a { justify-content: center; padding: 11px 0; }
  .sb-foot { border-top: 1px solid var(--bd); padding: 12px; font-size: 12px; color: var(--mut); }
  .sb-foot .plan { margin-bottom: 8px; } .sb-foot .plan b { color: var(--g); }
  .sb-foot button { display: flex; align-items: center; gap: 8px; background: none; border: none; color: var(--mut); font-size: 12.5px; padding: 6px 4px; border-radius: 8px; width: 100%; }
  .sb-foot button:hover { background: #fef2f2; color: #dc2626; }

  .main { flex: 1; overflow-y: auto; min-width: 0; }

  .ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .ph h1 { font-size: 22px; font-weight: 700; } .ph p { font-size: 13px; color: var(--mut); margin-top: 3px; }

  .btn:hover { border-color: var(--g); color: var(--g); }
  .btn.pri { background: var(--g); border-color: var(--g); color: #fff; } .btn.pri:hover { background: var(--g-dk); border-color: var(--g-dk); color: #fff; }
  .btn.dis { opacity: .5; }
  .card { background: #fff; border: 1px solid var(--bd); border-radius: 16px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.04); }

  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .mb { margin-bottom: 14px; }
  .kpi { position: relative; overflow: hidden; padding-left: 24px; }

  .kpi .ki { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--cb); color: var(--c); border: 1px solid var(--cd); margin-bottom: 12px; }
  .kpi small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--mut); }
  .kpi b { display: block; font-size: 26px; font-weight: 800; margin-top: 4px; line-height: 1.1; }
  .kpi span { font-size: 12px; color: var(--mut2); }

  .pill.g { background: var(--g-bg); color: var(--g); border-color: var(--g-bd); } .pill.r { background: #fef2f2; color: #ef4444; border-color: #fecaca; }
  .pill.a { background: #fffbeb; color: #d97706; border-color: #fde68a; } .pill.n { background: var(--bg); color: var(--mut2); border-color: var(--bd); }
  .seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .seg button { border: 1.5px solid var(--bd2); background: #fff; border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--mut); }
  .seg button.on { background: var(--g); border-color: var(--g); color: #fff; }
  .in { width: 100%; background: var(--bg); border: 1.5px solid var(--bd2); border-radius: 10px; padding: 9px 12px; font-size: 13.5px; outline: none; transition: all .15s; }
  .in:focus { border-color: var(--g); background: #fff; }
  .fl { display: block; font-size: 12px; font-weight: 600; color: #374151; margin: 0 0 5px; }
  .empty { text-align: center; color: var(--mut2); padding: 36px 12px; font-size: 13.5px; } .empty .ic { color: #cbd5e1; display: block; margin: 0 auto 8px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut2); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--bd); white-space: nowrap; }
  td { padding: 11px 12px; font-size: 13px; border-bottom: 1px solid var(--bd); vertical-align: middle; }
  tbody tr:nth-child(even) { background: #fafafa; } tr.click { cursor: pointer; } tr.click:hover { background: var(--g-bg); }
  tr.void { background: #fef2f2 !important; opacity: .8; } tr.void .tot { text-decoration: line-through; color: var(--mut2); }
  .tw { overflow-x: auto; }
  .num { text-align: right; } td.num, th.num { text-align: right; }
  .bar { height: 6px; border-radius: 6px; background: var(--bd); overflow: hidden; } .bar i { display: block; height: 100%; border-radius: 6px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .sq { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; background: var(--cb); color: var(--c); }
  .list > div { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--bd); font-size: 13px; } .list > div:last-child { border: 0; }
  .list .gr { flex: 1; min-width: 0; } .list small { color: var(--mut2); font-size: 11.5px; display: block; }
  .chart { position: relative; } .chart svg { width: 100%; height: auto; display: block; }
  .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--bd2); border-radius: 12px; padding: 8px 12px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.1); display: none; transform: translate(-50%, -110%); white-space: nowrap; z-index: 3; }
  .tip b { display: block; font-size: 14px; color: var(--g); }

  /* POS */
  .pos { display: flex; height: 100%; }
  .pos-l { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pos-top { height: 56px; background: #fff; border-bottom: 1px solid var(--bd); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; gap: 10px; flex-shrink: 0; }
  .pos-top h1 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .pos-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
  .sr { position: relative; margin-bottom: 12px; } .sr .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--mut2); } .sr .in { padding-left: 38px; }
  .cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
  .cats button { border: 1.5px solid var(--bd2); background: #fff; border-radius: 20px; padding: 6px 14px; font-size: 12.5px; font-weight: 600; color: var(--mut); white-space: nowrap; }
  .cats button.on { background: var(--g); border-color: var(--g); color: #fff; }
  .pg { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .pc { position: relative; background: #fff; border: 1.5px solid var(--bd); border-radius: 12px; padding: 12px 8px; text-align: center; transition: all .15s; }

  .pc .p { font-size: 13px; font-weight: 700; margin-top: 4px; } .pc .s { font-size: 11px; color: var(--mut2); }
  .pc .s.low { color: #d97706; font-weight: 600; } .pc .s.out { color: #ef4444; font-weight: 700; }
  .pc .bdg { position: absolute; top: 6px; right: 6px; background: var(--g); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 6px; }
  .cart { width: 280px; background: #fff; border-left: 1px solid var(--bd); display: flex; flex-direction: column; flex-shrink: 0; }
  .cart-h { padding: 14px 16px; border-bottom: 1px solid var(--bd); display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }

  .cart-h button { margin-left: auto; background: none; border: none; color: #ef4444; font-size: 12px; font-weight: 600; }
  .cart-i { flex: 1; overflow-y: auto; padding: 8px 16px; }
  .ci { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--bd); }
  .ci .t { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; } .ci .t small { display: block; color: var(--mut2); font-weight: 400; font-size: 11px; }
  .qb { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--bd2); background: #fff; display: grid; place-items: center; color: #374151; }
  .qb:hover { border-color: var(--g); color: var(--g); }
  .ci .q { font-size: 13px; font-weight: 700; min-width: 16px; text-align: center; } .ci .lt { font-size: 12.5px; font-weight: 700; color: var(--g); min-width: 58px; text-align: right; }
  .cart-f { background: var(--bg); border-top: 1px solid var(--bd); padding: 14px 16px; }
  .tr { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--mut); margin-bottom: 5px; }
  .tr.tt { border-top: 1.5px dashed var(--bd2); padding-top: 8px; margin-top: 6px; font-size: 15px; font-weight: 800; color: var(--g); }
  .pm { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; }
  .pm button { border: 1.5px solid var(--bd2); background: #fff; border-radius: 10px; padding: 8px 4px; font-size: 11.5px; font-weight: 600; color: var(--mut); display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .pm button.on { background: var(--g-bg); border-color: var(--g); color: var(--g); }
  .cobrar { width: 100%; border: none; border-radius: 12px; background: var(--g); color: #fff; font-weight: 800; font-size: 15px; padding: 13px; }
  .cobrar:hover:not(:disabled) { background: var(--g-dk); } .cobrar:disabled { background: var(--bd2); color: var(--mut2); cursor: not-allowed; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--g); display: inline-block; }

  /* Modals */
  .ov { position: fixed; inset: 0; background: rgba(10,14,26,.5); display: grid; place-items: center; padding: 16px; z-index: 200; animation: fade .15s; overflow-y: auto; }
  @keyframes fade { from { opacity: 0; } }
  .md { background: #fff; border-radius: 20px; box-shadow: 0 24px 64px rgba(0,0,0,.15); width: 100%; max-width: 440px; padding: 22px; max-height: calc(100dvh - 32px); overflow-y: auto; }
  .md.sm { max-width: 320px; } .md.lg { max-width: 520px; }
  .md-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .md-h h2 { font-size: 16px; font-weight: 700; }
  .x { width: 30px; height: 30px; border-radius: 8px; border: none; background: var(--bg); color: var(--mut); display: grid; place-items: center; } .x:hover { background: var(--bd2); }
  .fg { margin-bottom: 12px; } .f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .acts-r { display: flex; gap: 8px; margin-top: 16px; } .acts-r .btn { flex: 1; justify-content: center; }
  .amt { text-align: center; font-size: 32px; font-weight: 800; margin: 4px 0 2px; }
  .kp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; }
  .kp button { background: var(--bg); border: 1.5px solid var(--bd); border-radius: 10px; padding: 12px 0; font-size: 18px; font-weight: 700; } .kp button:hover { background: var(--g-bg); border-color: var(--g-bd); } .kp button.del { color: #ef4444; }
  .qk { display: flex; gap: 6px; margin-bottom: 8px; } .qk button { flex: 1; background: #fff; border: 1.5px solid var(--bd2); border-radius: 8px; padding: 6px 0; font-size: 12px; font-weight: 700; color: #374151; }
  .vu { background: var(--g-bg); border: 1px solid var(--g-bd); border-radius: 10px; padding: 8px 12px; display: flex; justify-content: space-between; font-weight: 700; color: var(--g-dk); font-size: 14px; }
  .box { background: var(--bg); border-radius: 12px; padding: 18px; text-align: center; color: var(--mut); font-size: 13px; } .box .ic { color: var(--mut2); margin-bottom: 6px; }
  .hint { text-align: center; font-size: 11px; color: var(--mut2); margin-top: 8px; }
  .ok { position: fixed; inset: 0; background: rgba(10,14,26,.6); display: grid; place-items: center; z-index: 300; color: #fff; text-align: center; animation: fade .15s; }
  .ok .c { width: 72px; height: 72px; border-radius: 50%; background: var(--g); display: grid; place-items: center; margin: 0 auto 14px; } .ok b { display: block; font-size: 20px; }
  .tk { font-family: 'Courier New', monospace; font-size: 12px; }
  .tk .hd { text-align: center; padding-bottom: 12px; border-bottom: 2px dashed var(--bd2); margin-bottom: 10px; } .tk .lg { width: 40px; height: 40px; border-radius: 10px; background: var(--g); color: #fff; display: grid; place-items: center; margin: 0 auto 6px; }
  .tk .it { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; } .tk .it small { color: var(--mut); display: block; }
  .tk .tt { display: flex; justify-content: space-between; font-weight: 700; color: var(--g); font-size: 15px; border-top: 2px dashed var(--bd2); padding-top: 8px; margin-top: 6px; }
  .tk .ft { text-align: center; color: var(--mut); border-top: 2px dashed var(--bd2); margin-top: 10px; padding-top: 10px; }
  .fe { margin-top: 10px; background: var(--g-bg); border: 1px solid var(--g-bd); color: var(--g-dk); border-radius: 8px; padding: 7px 10px; font-family: 'DM Sans', sans-serif; font-size: 11.5px; display: flex; gap: 6px; align-items: flex-start; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 12px; z-index: 400; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100vw - 32px); text-align: center; animation: fade .15s; }
  .dd { position: relative; display: inline-block; } .dd-m { position: absolute; top: calc(100% + 6px); left: 0; background: #fff; border: 1.5px solid var(--bd2); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.1); min-width: 200px; z-index: 20; padding: 4px; }
  .dd-m button { display: flex; justify-content: space-between; width: 100%; border: none; background: none; padding: 9px 12px; border-radius: 8px; font-size: 13px; text-align: left; } .dd-m button:hover { background: var(--bg); } .dd-m button.on { color: var(--g); font-weight: 700; }
  .dd > button { border: 1.5px solid var(--bd2); background: #fff; border-radius: 12px; padding: 9px 14px; font-size: 13.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
  .ph-page { max-width: 520px; margin: 60px auto; text-align: center; } .ph-page .big { width: 64px; height: 64px; border-radius: 18px; background: var(--g-bg); color: var(--g); display: grid; place-items: center; margin: 0 auto 16px; }
  .ph-page h1 { font-size: 22px; margin-bottom: 8px; } .ph-page p { color: var(--mut); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }

  @media (max-width: 1023px) { .sb:not(.col) { width: 60px; } .sb:not(.col) .nm, .sb:not(.col) .biz, .sb:not(.col) .lbl, .sb:not(.col) .plan { display: none; } .sb:not(.col) .nav a { justify-content: center; padding: 11px 0; } .sb:not(.col) .sb-head img { display: none; } .sb:not(.col) .sb-head { justify-content: center; padding: 0; } .sb-tg { display: none; } }
  @media (max-width: 900px) { .grid4 { grid-template-columns: 1fr 1fr; } .grid3 { grid-template-columns: 1fr; } .grid2 { grid-template-columns: 1fr; } .dash-row { grid-template-columns: 1fr !important; } }
  @media (max-width: 767px) {
    :root { --bar: 0px; } .demo-bar { display: none; }
    .sb { display: none; } .app { flex-direction: column; height: 100dvh; }
    .mtop { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 14px; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.08); flex-shrink: 0; font-weight: 800; font-size: 16px; }
