# Carpeta de funciones serverless (antes chat.js estaba en la raíz y
# probablemente Netlify no lo desplegaba).
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# ── Headers de seguridad — todas las rutas ────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://app.cal.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://app.cal.com https://cal.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://app.cal.com https://cal.com; frame-src https://app.cal.com https://cal.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Cache fonts for 1 year — they never change
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache HTML for 1 hour with revalidation
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Cache JS for 1 week
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"
